AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LinkedIn Post Automation with Approval Workflow

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  NotificationEmail:
    Type: String
    Default: imjamesl@amazon.co.uk
    Description: Email address for draft notifications
  DraftCount:
    Type: Number
    Default: 3
    Description: Number of drafts to generate per run

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 300
    MemorySize: 512
    Environment:
      Variables:
        POSTS_TABLE: !Sub 'linkedin-automation-posts-${Environment}'
        CONFIG_TABLE: !Sub 'linkedin-automation-config-${Environment}'
        SECRETS_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:linkedin-automation/credentials'
        NOTIFICATION_EMAIL: !Ref NotificationEmail

Resources:
  # ============================================
  # DynamoDB Tables
  # ============================================
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'linkedin-automation-posts-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'linkedin-automation-config-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ============================================
  # S3 Bucket for Frontend
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'linkedin-automation-frontend-${AWS::AccountId}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ============================================
  # CloudFront Distribution
  # ============================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
        PriceClass: PriceClass_100

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'linkedin-automation-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ============================================
  # API Gateway for Approval Actions
  # ============================================
  ApprovalApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'linkedin-automation-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ============================================
  # Lambda Functions
  # ============================================

  # Token Refresh Function
  TokenRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-token-refresh-${Environment}'
      CodeUri: ../src/lambdas/token-refresh/
      Handler: index.handler
      Policies:
        - SecretsManagerReadWrite
      Events:
        ScheduledRefresh:
          Type: Schedule
          Properties:
            Schedule: rate(12 hours)
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

  # Research Agent Function
  ResearchAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-research-agent-${Environment}'
      CodeUri: ../src/lambdas/research-agent/
      Handler: index.handler
      Timeout: 600
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

  # Content Generator Function
  ContentGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-content-generator-${Environment}'
      CodeUri: ../src/lambdas/content-generator/
      Handler: index.handler
      Timeout: 600
      Environment:
        Variables:
          DRAFT_COUNT: !Ref DraftCount
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

  # Quality Reviewer Function
  QualityReviewerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-quality-reviewer-${Environment}'
      CodeUri: ../src/lambdas/quality-reviewer/
      Handler: index.handler
      Timeout: 600
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

  # Draft Notifier Function (sends emails)
  DraftNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-draft-notifier-${Environment}'
      CodeUri: ../src/lambdas/draft-notifier/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

  # Draft Approval Function (API handler)
  DraftApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-draft-approval-${Environment}'
      CodeUri: ../src/lambdas/draft-approval/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - SecretsManagerReadWrite
      Events:
        ListDrafts:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts
            Method: GET
        GetDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}
            Method: GET
        UpdateDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}
            Method: PUT
        ApproveDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}/approve
            Method: POST
        RejectDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}/reject
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

  # LinkedIn Publisher Function
  LinkedInPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-linkedin-publisher-${Environment}'
      CodeUri: ../src/lambdas/linkedin-publisher/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - SecretsManagerReadWrite
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

  # ============================================
  # Step Functions State Machine
  # ============================================
  PostGenerationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'linkedin-automation-workflow-${Environment}'
      DefinitionUri: step-functions-v2.asl.json
      DefinitionSubstitutions:
        ResearchAgentFunctionArn: !GetAtt ResearchAgentFunction.Arn
        ContentGeneratorFunctionArn: !GetAtt ContentGeneratorFunction.Arn
        QualityReviewerFunctionArn: !GetAtt QualityReviewerFunction.Arn
        DraftNotifierFunctionArn: !GetAtt DraftNotifierFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ResearchAgentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ContentGeneratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref QualityReviewerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref DraftNotifierFunction
      Events:
        DailyTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 ? * MON-FRI *)
            Enabled: true
            Input: '{"triggeredBy": "schedule"}'

Outputs:
  ApiUrl:
    Description: API Gateway URL for approval actions
    Value: !Sub 'https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  FrontendUrl:
    Description: CloudFront URL for the edit interface
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-FrontendUrl'

  FrontendBucketName:
    Description: S3 bucket for frontend files
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'

  PostsTableName:
    Description: DynamoDB posts table name
    Value: !Ref PostsTable
    Export:
      Name: !Sub '${AWS::StackName}-PostsTableName'

  ConfigTableName:
    Description: DynamoDB config table name
    Value: !Ref ConfigTable
    Export:
      Name: !Sub '${AWS::StackName}-ConfigTableName'

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref PostGenerationStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineArn'
