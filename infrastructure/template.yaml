AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LinkedIn Post Automation - Agentic workflow for generating and publishing LinkedIn posts

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  PostingSchedule:
    Type: String
    Default: 'cron(0 9 ? * MON-FRI *)'
    Description: Cron expression for posting schedule (default 9 AM UTC Mon-Fri)

  TokenRefreshSchedule:
    Type: String
    Default: 'cron(30 8 ? * * *)'
    Description: Cron expression for token refresh (default 8:30 AM UTC daily)

  BedrockModelId:
    Type: String
    Default: 'anthropic.claude-3-sonnet-20240229-v1:0'
    Description: Bedrock model ID for content generation

  LinkedInSecretArn:
    Type: String
    Default: 'arn:aws:secretsmanager:us-east-1:563146874500:secret:linkedin-automation/credentials-dlUl32'
    Description: ARN of the existing LinkedIn credentials secret

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        SECRETS_ARN: !Ref LinkedInSecretArn
        POSTS_TABLE: !Ref PostsTable
        CONFIG_TABLE: !Ref ConfigTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
    Architectures:
      - arm64

Resources:
  # ============================================
  # SECRETS (Reference existing secret created via setup script)
  # ============================================
  # Note: The secret 'linkedin-automation/credentials' must be created before deployment
  # using: npm run setup:secrets

  # ============================================
  # DYNAMODB TABLES
  # ============================================
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'linkedin-automation-posts-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'linkedin-automation-config-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================
  # IAM ROLES
  # ============================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'linkedin-automation-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:UpdateSecret
                Resource: !Ref LinkedInSecretArn
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt PostsTable.Arn
                  - !Sub '${PostsTable.Arn}/index/*'
                  - !GetAtt ConfigTable.Arn
                  - !Sub '${ConfigTable.Arn}/index/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'linkedin-automation-sfn-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ResearchAgentFunction.Arn
                  - !GetAtt ContentGeneratorFunction.Arn
                  - !GetAtt QualityReviewerFunction.Arn
                  - !GetAtt LinkedInPublisherFunction.Arn
                  - !GetAtt DraftNotifierFunction.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  # ============================================
  # LAMBDA FUNCTIONS
  # ============================================
  TokenRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-token-refresh-${Environment}'
      CodeUri: ../
      Handler: src/lambdas/token-refresh/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Refreshes LinkedIn OAuth tokens before expiry
      Events:
        ScheduledRefresh:
          Type: Schedule
          Properties:
            Schedule: !Ref TokenRefreshSchedule
            Description: Daily token refresh check
            Enabled: true
      Tags:
        Environment: !Ref Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambdas/token-refresh/index.ts
        External:
          - '@aws-sdk/*'

  ResearchAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-research-agent-${Environment}'
      CodeUri: ../
      Handler: src/lambdas/research-agent/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      Description: Fetches and analyzes RSS feeds for content topics
      Tags:
        Environment: !Ref Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambdas/research-agent/index.ts
        External:
          - '@aws-sdk/*'

  ContentGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-content-generator-${Environment}'
      CodeUri: ../
      Handler: src/lambdas/content-generator/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      Description: Generates LinkedIn posts using Bedrock
      Tags:
        Environment: !Ref Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambdas/content-generator/index.ts
        External:
          - '@aws-sdk/*'

  QualityReviewerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-quality-reviewer-${Environment}'
      CodeUri: ../
      Handler: src/lambdas/quality-reviewer/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      Description: Reviews and validates generated content
      Tags:
        Environment: !Ref Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambdas/quality-reviewer/index.ts
        External:
          - '@aws-sdk/*'

  LinkedInPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-linkedin-publisher-${Environment}'
      CodeUri: ../
      Handler: src/lambdas/linkedin-publisher/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Publishes posts to LinkedIn API
      Tags:
        Environment: !Ref Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambdas/linkedin-publisher/index.ts
        External:
          - '@aws-sdk/*'

  DraftNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-draft-notifier-${Environment}'
      CodeUri: ../
      Handler: src/lambdas/draft-notifier/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Description: Sends email notifications for draft approval
      Environment:
        Variables:
          NOTIFICATION_EMAIL: 'imjamesl@amazon.co.uk'
          SENDER_EMAIL: 'imjamesl@amazon.co.uk'
          API_BASE_URL: !Sub 'https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
          FRONTEND_URL: !Sub 'https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
      Tags:
        Environment: !Ref Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambdas/draft-notifier/index.ts
        External:
          - '@aws-sdk/*'

  DraftApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'linkedin-automation-draft-approval-${Environment}'
      CodeUri: ../
      Handler: src/lambdas/draft-approval/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Description: Handles draft approval/rejection via API
      Events:
        ListDrafts:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts
            Method: GET
        GetDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}
            Method: GET
        UpdateDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}
            Method: PUT
        ApproveDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}/approve
            Method: POST
        RejectDraft:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /drafts/{postId}/reject
            Method: POST
        OptionsHandler:
          Type: Api
          Properties:
            RestApiId: !Ref ApprovalApi
            Path: /{proxy+}
            Method: OPTIONS
      Tags:
        Environment: !Ref Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambdas/draft-approval/index.ts
        External:
          - '@aws-sdk/*'

  # ============================================
  # API GATEWAY
  # ============================================
  ApprovalApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'linkedin-automation-approval-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Tags:
        Environment: !Ref Environment

  # ============================================
  # STEP FUNCTIONS STATE MACHINE
  # ============================================
  PostGenerationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'linkedin-automation-workflow-${Environment}'
      DefinitionUri: ./step-functions.asl.json
      DefinitionSubstitutions:
        ResearchAgentFunctionArn: !GetAtt ResearchAgentFunction.Arn
        ContentGeneratorFunctionArn: !GetAtt ContentGeneratorFunction.Arn
        QualityReviewerFunctionArn: !GetAtt QualityReviewerFunction.Arn
        LinkedInPublisherFunctionArn: !GetAtt LinkedInPublisherFunction.Arn
        DraftNotifierFunctionArn: !GetAtt DraftNotifierFunction.Arn
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      Events:
        DailyTrigger:
          Type: Schedule
          Properties:
            Schedule: !Ref PostingSchedule
            Description: Daily post generation trigger
            Enabled: true
      Tags:
        Environment: !Ref Environment

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/stepfunctions/linkedin-automation-${Environment}'
      RetentionInDays: 30

  # ============================================
  # CLOUDWATCH ALARMS
  # ============================================
  StateMachineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'linkedin-automation-workflow-failures-${Environment}'
      AlarmDescription: Alarm when the post generation workflow fails
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref PostGenerationStateMachine
      TreatMissingData: notBreaching

Outputs:
  StateMachineArn:
    Description: ARN of the Step Functions state machine
    Value: !Ref PostGenerationStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineArn'

  PostsTableName:
    Description: Name of the DynamoDB posts table
    Value: !Ref PostsTable
    Export:
      Name: !Sub '${AWS::StackName}-PostsTableName'

  ConfigTableName:
    Description: Name of the DynamoDB config table
    Value: !Ref ConfigTable
    Export:
      Name: !Sub '${AWS::StackName}-ConfigTableName'

  SecretsArn:
    Description: ARN of the Secrets Manager secret
    Value: !Ref LinkedInSecretArn
    Export:
      Name: !Sub '${AWS::StackName}-SecretsArn'

  ApprovalApiUrl:
    Description: URL of the Approval API Gateway
    Value: !Sub 'https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApprovalApiUrl'
