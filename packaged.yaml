AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LinkedIn Post Automation - Agentic workflow for generating and publishing
  LinkedIn posts
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
    Description: Deployment environment
  PostingSchedule:
    Type: String
    Default: cron(0 9 ? * MON-FRI *)
    Description: Cron expression for posting schedule (default 9 AM UTC Mon-Fri)
  TokenRefreshSchedule:
    Type: String
    Default: cron(30 8 ? * * *)
    Description: Cron expression for token refresh (default 8:30 AM UTC daily)
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-sonnet-20240229-v1:0
    Description: Bedrock model ID for content generation
  LinkedInSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:563146874500:secret:linkedin-automation/credentials-dlUl32
    Description: ARN of the existing LinkedIn credentials secret
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        SECRETS_ARN:
          Ref: LinkedInSecretArn
        POSTS_TABLE:
          Ref: PostsTable
        CONFIG_TABLE:
          Ref: ConfigTable
        BEDROCK_MODEL_ID:
          Ref: BedrockModelId
    Architectures:
    - arm64
Resources:
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: linkedin-automation-posts-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      - AttributeName: gsi1pk
        AttributeType: S
      - AttributeName: gsi1sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: gsi1
        KeySchema:
        - AttributeName: gsi1pk
          KeyType: HASH
        - AttributeName: gsi1sk
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
    Metadata:
      SamResourceId: PostsTable
  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: linkedin-automation-config-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
    Metadata:
      SamResourceId: ConfigTable
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: linkedin-automation-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SecretsManagerAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:UpdateSecret
            Resource:
              Ref: LinkedInSecretArn
      - PolicyName: DynamoDBAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            Resource:
            - Fn::GetAtt:
              - PostsTable
              - Arn
            - Fn::Sub: ${PostsTable.Arn}/index/*
            - Fn::GetAtt:
              - ConfigTable
              - Arn
            - Fn::Sub: ${ConfigTable.Arn}/index/*
      - PolicyName: BedrockAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            Resource:
              Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/*
      - PolicyName: SESAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ses:SendEmail
            - ses:SendRawEmail
            Resource: '*'
    Metadata:
      SamResourceId: LambdaExecutionRole
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: linkedin-automation-sfn-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeLambda
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - ResearchAgentFunction
              - Arn
            - Fn::GetAtt:
              - ContentGeneratorFunction
              - Arn
            - Fn::GetAtt:
              - QualityReviewerFunction
              - Arn
            - Fn::GetAtt:
              - LinkedInPublisherFunction
              - Arn
            - Fn::GetAtt:
              - DraftNotifierFunction
              - Arn
      - PolicyName: CloudWatchLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogDelivery
            - logs:GetLogDelivery
            - logs:UpdateLogDelivery
            - logs:DeleteLogDelivery
            - logs:ListLogDeliveries
            - logs:PutResourcePolicy
            - logs:DescribeResourcePolicies
            - logs:DescribeLogGroups
            Resource: '*'
    Metadata:
      SamResourceId: StepFunctionsExecutionRole
  TokenRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: linkedin-automation-token-refresh-${Environment}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3/64fcd7b0242b2fd6f320d40b36828395
      Handler: src/lambdas/token-refresh/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Description: Refreshes LinkedIn OAuth tokens before expiry
      Events:
        ScheduledRefresh:
          Type: Schedule
          Properties:
            Schedule:
              Ref: TokenRefreshSchedule
            Description: Daily token refresh check
            Enabled: true
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
        - src/lambdas/token-refresh/index.ts
        External:
        - '@aws-sdk/*'
      SamResourceId: TokenRefreshFunction
  ResearchAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: linkedin-automation-research-agent-${Environment}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3/64fcd7b0242b2fd6f320d40b36828395
      Handler: src/lambdas/research-agent/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Timeout: 120
      MemorySize: 512
      Description: Fetches and analyzes RSS feeds for content topics
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
        - src/lambdas/research-agent/index.ts
        External:
        - '@aws-sdk/*'
      SamResourceId: ResearchAgentFunction
  ContentGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: linkedin-automation-content-generator-${Environment}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3/64fcd7b0242b2fd6f320d40b36828395
      Handler: src/lambdas/content-generator/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Timeout: 120
      MemorySize: 512
      Description: Generates LinkedIn posts using Bedrock
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
        - src/lambdas/content-generator/index.ts
        External:
        - '@aws-sdk/*'
      SamResourceId: ContentGeneratorFunction
  QualityReviewerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: linkedin-automation-quality-reviewer-${Environment}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3/64fcd7b0242b2fd6f320d40b36828395
      Handler: src/lambdas/quality-reviewer/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Timeout: 120
      MemorySize: 512
      Description: Reviews and validates generated content
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
        - src/lambdas/quality-reviewer/index.ts
        External:
        - '@aws-sdk/*'
      SamResourceId: QualityReviewerFunction
  LinkedInPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: linkedin-automation-linkedin-publisher-${Environment}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3/64fcd7b0242b2fd6f320d40b36828395
      Handler: src/lambdas/linkedin-publisher/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Description: Publishes posts to LinkedIn API
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
        - src/lambdas/linkedin-publisher/index.ts
        External:
        - '@aws-sdk/*'
      SamResourceId: LinkedInPublisherFunction
  DraftNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: linkedin-automation-draft-notifier-${Environment}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3/64fcd7b0242b2fd6f320d40b36828395
      Handler: src/lambdas/draft-notifier/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Timeout: 30
      Description: Sends email notifications for draft approval
      Environment:
        Variables:
          NOTIFICATION_EMAIL: imjamesl@amazon.co.uk
          SENDER_EMAIL: imjamesl@amazon.co.uk
          API_BASE_URL:
            Fn::Sub: https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          FRONTEND_URL:
            Fn::Sub: https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
        - src/lambdas/draft-notifier/index.ts
        External:
        - '@aws-sdk/*'
      SamResourceId: DraftNotifierFunction
  DraftApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: linkedin-automation-draft-approval-${Environment}
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3/64fcd7b0242b2fd6f320d40b36828395
      Handler: src/lambdas/draft-approval/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Timeout: 30
      Description: Handles draft approval/rejection via API
      Events:
        ListDrafts:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApprovalApi
            Path: /drafts
            Method: GET
        GetDraft:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApprovalApi
            Path: /drafts/{postId}
            Method: GET
        UpdateDraft:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApprovalApi
            Path: /drafts/{postId}
            Method: PUT
        ApproveDraft:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApprovalApi
            Path: /drafts/{postId}/approve
            Method: POST
        RejectDraft:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApprovalApi
            Path: /drafts/{postId}/reject
            Method: POST
        OptionsHandler:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApprovalApi
            Path: /{proxy+}
            Method: OPTIONS
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
        - src/lambdas/draft-approval/index.ts
        External:
        - '@aws-sdk/*'
      SamResourceId: DraftApprovalFunction
  ApprovalApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: linkedin-automation-approval-api-${Environment}
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      SamResourceId: ApprovalApi
  PostGenerationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name:
        Fn::Sub: linkedin-automation-workflow-${Environment}
      DefinitionUri:
        Bucket: aws-sam-cli-managed-default-samclisourcebucket-1caje6tnskfe3
        Key: 1938a738a2ce3bc9b3ece2778388a613
      DefinitionSubstitutions:
        ResearchAgentFunctionArn:
          Fn::GetAtt:
          - ResearchAgentFunction
          - Arn
        ContentGeneratorFunctionArn:
          Fn::GetAtt:
          - ContentGeneratorFunction
          - Arn
        QualityReviewerFunctionArn:
          Fn::GetAtt:
          - QualityReviewerFunction
          - Arn
        LinkedInPublisherFunctionArn:
          Fn::GetAtt:
          - LinkedInPublisherFunction
          - Arn
        DraftNotifierFunctionArn:
          Fn::GetAtt:
          - DraftNotifierFunction
          - Arn
      Role:
        Fn::GetAtt:
        - StepFunctionsExecutionRole
        - Arn
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
        - CloudWatchLogsLogGroup:
            LogGroupArn:
              Fn::GetAtt:
              - StateMachineLogGroup
              - Arn
      Events:
        DailyTrigger:
          Type: Schedule
          Properties:
            Schedule:
              Ref: PostingSchedule
            Description: Daily post generation trigger
            Enabled: true
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      SamResourceId: PostGenerationStateMachine
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/stepfunctions/linkedin-automation-${Environment}
      RetentionInDays: 30
    Metadata:
      SamResourceId: StateMachineLogGroup
  StateMachineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: linkedin-automation-workflow-failures-${Environment}
      AlarmDescription: Alarm when the post generation workflow fails
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
      - Name: StateMachineArn
        Value:
          Ref: PostGenerationStateMachine
      TreatMissingData: notBreaching
    Metadata:
      SamResourceId: StateMachineFailureAlarm
Outputs:
  StateMachineArn:
    Description: ARN of the Step Functions state machine
    Value:
      Ref: PostGenerationStateMachine
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-StateMachineArn
  PostsTableName:
    Description: Name of the DynamoDB posts table
    Value:
      Ref: PostsTable
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PostsTableName
  ConfigTableName:
    Description: Name of the DynamoDB config table
    Value:
      Ref: ConfigTable
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ConfigTableName
  SecretsArn:
    Description: ARN of the Secrets Manager secret
    Value:
      Ref: LinkedInSecretArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-SecretsArn
  ApprovalApiUrl:
    Description: URL of the Approval API Gateway
    Value:
      Fn::Sub: https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ApprovalApiUrl
