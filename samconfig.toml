# SAM CLI Configuration
# More information about the format of this file can be found at:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html

version = 0.1

[default]
[default.global.parameters]
stack_name = "linkedin-automation"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "Environment=dev LinkedInSecretArn=arn:aws:secretsmanager:us-east-1:563146874500:secret:linkedin-automation/credentials-dlUl32"

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Development environment
[dev]
[dev.deploy.parameters]
stack_name = "linkedin-automation-dev"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "Environment=dev LinkedInSecretArn=arn:aws:secretsmanager:us-east-1:563146874500:secret:linkedin-automation/credentials-dlUl32"

# Production environment
[prod]
[prod.deploy.parameters]
stack_name = "linkedin-automation-prod"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "Environment=prod LinkedInSecretArn=arn:aws:secretsmanager:us-east-1:563146874500:secret:linkedin-automation/credentials-dlUl32"
